[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gators-verse"
version = "1.0.0"
description = "Rhyme and stanza analysis of Galician poetry (GATORS, Galician Tool for Rhyme and Stanza)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.10"
# trasgo and gama-verse are not on PyPI yet: they are installed from GitHub.
dependencies = [
    "pandas",
    "regex",
    "trasgo @ git+https://github.com/compellit/trasgo",
]
authors = [
    { name = "Anxo Alonso Pérez" },
    { name = "Pablo Ruiz Fabo" },
]
keywords = ["Galician", "poetry", "rhyme", "stanza", "meter"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Natural Language :: Galician",
    "Topic :: Text Processing :: Linguistic",
]

[project.optional-dependencies]
gama = ["gama-verse @ git+https://github.com/compellit/gama"]
test = ["pytest"]

[project.scripts]
gators-verse = "gators_verse.cli:main"

[tool.setuptools.package-data]
gators_verse = ["data/*.json"]
